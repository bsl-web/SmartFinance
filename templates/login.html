<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - Financeiro</title>

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="login-body">

<div class="login-container">

    <div class="login-card">

        <h1>💰 Financeiro</h1>

        <p>
            Controle Financeiro Pessoal
        </p>

        <form
        action="/entrar"
        method="POST">

            <input
            type="text"
            name="usuario"
            placeholder="Usuário"
            required>

            <input
            type="password"
            name="senha"
            placeholder="Senha"
            required>

            <button type="submit">

                Entrar

            </button>

        </form>

        <div class="cadastro-info">

            <p>
                Não tem uma conta?
            </p>

            <a href="/cadastro">
                Cadastre-se
            </a>

        </div>

    </div>

</div>

</body>

</html>
