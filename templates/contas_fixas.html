<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Contas Fixas</title>

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="topbar">

    <h2>💰 Financeiro</h2>

    <a href="/dashboard" class="btn-sair">
        Dashboard
    </a>

</div>

<div class="container">

    <h1>Contas Fixas</h1>

    <div class="box">

        <h2>Adicionar Conta Fixa</h2>

        <form action="/conta_fixa" method="POST">

            <input
            type="text"
            name="nome"
            placeholder="Nome da conta"
            required>

            <input
            type="number"
            step="0.01"
            name="valor"
            placeholder="Valor"
            required>

            <button>
                Salvar Conta
            </button>

        </form>

    </div>

    <div class="historico">

        <h2>Lista de Contas Fixas</h2>

        <table>

            <thead>

                <tr>

                    <th>Nome</th>
                    <th>Valor</th>

                </tr>

            </thead>

            <tbody>

                {% for conta in contas_fixas %}

                <tr>

                    <td>
                        {{ conta.nome }}
                    </td>

                    <td>
                        R$ {{ conta.valor }}
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
